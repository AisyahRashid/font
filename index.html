<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Complete iOS Font Tester</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f0f2f5;
            color: #1c1e21;
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 1.6rem;
            margin-bottom: 8px;
        }
        p.subtitle {
            text-align: center;
            color: #606770;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .family-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e4e6eb;
        }
        .family-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #0066cc;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .style-row {
            padding: 10px 0;
            border-bottom: 1px dashed #e4e6eb;
        }
        .style-row:last-child {
            border-bottom: none;
        }
        .style-name {
            font-size: 0.75rem;
            color: #8a8d91;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .sample-text {
            font-size: 1.35rem;
            line-height: 1.4;
            color: #050505;
            word-break: break-word;
        }
    </style>
</head>

            { family: "Symbol", styles: ["Symbol"] },
            { family: "Menlo", styles: ["Menlo-Italic", "Menlo-Bold", "Menlo-Regular", "Menlo-BoldItalic"] },
            { family: "Bodoni 72 Smallcaps", styles: ["BodoniSvtyTwoSCITCTT-Book"] },

            { family: "PingFang SC", styles: ["PingFangSC-Ultralight", "PingFangSC-Regular", "PingFangSC-Semibold", "PingFangSC-Thin", "PingFangSC-Light", "PingFangSC-Medium"] },
            { family: "Euphemia UCAS", styles: ["EuphemiaUCAS-Italic", "EuphemiaUCAS", "EuphemiaUCAS-Bold"] },
            { family: "Telugu Sangam MN", styles: ["Telugu Sangam MN"] },
            { family: "Bangla Sangam MN", styles: ["Bangla Sangam MN"] },
            { family: "Zapfino", styles: ["Zapfino"] },
            { family: "Bodoni 72 Oldstyle", styles: ["BodoniSvtyTwoOSITCTT-Book", "BodoniSvtyTwoOSITCTT-Bold", "BodoniSvtyTwoOSITCTT-BookIt"] }
        ];

        const container = document.getElementById('font-container');
        const sampleString = "Puzzle Solver of the Year: MAMA!";

        // Generate visual HTML elements for every font automatically
        fontData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'family-card';
            
            const title = document.createElement('div');
            title.className = 'family-title';
            title.textContent = `Family: ${item.family}`;
            card.appendChild(title);

            item.styles.forEach(styleName => {
                const row = document.createElement('div');
                row.className = 'style-row';

                const label = document.createElement('div');
                label.className = 'style-name';
                label.textContent = `Font: ${styleName}`;
                row.appendChild(label);

                const sample = document.createElement('div');
                sample.className = 'sample-text';
                sample.textContent = sampleString;
                
                // Tells iOS browser to use the exact PostScript font style or fallback to family
                sample.style.fontFamily = `"${styleName}", "${item.family}", sans-serif`;

                row.appendChild(sample);
                card.appendChild(row);
            });

            container.appendChild(card);
        });
    </script>
</body>
</html>
